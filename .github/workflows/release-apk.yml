name: Release APK to GitHub Releases

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write  # Required to create releases

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Environment Configuration
        run: |
          # Secrets Gradle Plugin requires .env or .env.example
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Get version info
        id: version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Rename APK with version
        id: rename_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          VERSION="${{ steps.version.outputs.version }}"
          NEW_NAME="Aura-${VERSION}.apk"
          NEW_PATH="app/build/outputs/apk/debug/${NEW_NAME}"
          mv "$APK_PATH" "$NEW_PATH"
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT
          
          # Get APK size
          APK_SIZE=$(du -h "$NEW_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          
          echo "Renamed APK to: $NEW_NAME (Size: $APK_SIZE)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.rename_apk.outputs.apk_path }}
          tag_name: ${{ steps.version.outputs.version }}
          name: Aura ${{ steps.version.outputs.version }}
          body: |
            ## 📱 Aura Android App - ${{ steps.version.outputs.version }}
            
            ### Download & Install
            
            1. **Download** the APK file below (`${{ steps.rename_apk.outputs.apk_name }}`)
            2. **Transfer** it to your Android device if downloaded on desktop
            3. **Tap** the APK file to install
            4. If prompted, **enable** "Install from Unknown Sources" for your browser/file manager
            5. **Open** Aura and enjoy!
            
            ### Build Info
            
            - **Package ID**: `com.aistudio.aura.qzxkwv`
            - **Build Type**: Debug (Auto-signed)
            - **APK Size**: ${{ steps.rename_apk.outputs.apk_size }}
            - **Min SDK**: Android 7.0 (API 24)
            - **Target SDK**: Android 14 (API 36)
            
            ---
            
            **Note**: This is a debug build for testing purposes. For production, use a properly signed release build.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Summary
        run: |
          echo "## ✅ Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK**: ${{ steps.rename_apk.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Size**: ${{ steps.rename_apk.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Download Link" >> $GITHUB_STEP_SUMMARY
          echo "[Download from Releases Page](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
