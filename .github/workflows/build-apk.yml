name: Build and Deliver Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Environment Configuration
        run: |
          # Secrets Gradle Plugin requires .env or .env.example
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Ensure Gradle Wrapper is Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK was created
        id: verify_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          else
            echo "ERROR: No APK generated!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Build Summary for Device Testing
        run: |
          echo "## 📱 Aura Android APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | **Aura** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | \`Debug (Auto-signed for direct device sideloading)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | \`com.aistudio.aura.qzxkwv\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | **Aura-Debug-APK** (contains \`app-debug.apk\`) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 How to Download & Install on Your Android Device:" >> $GITHUB_STEP_SUMMARY
          echo "1. On your phone browser or desktop, scroll down to the **Artifacts** section at the bottom of this Action run page." >> $GITHUB_STEP_SUMMARY
          echo "2. Download **\`Aura-Debug-APK.zip\`**." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the ZIP file to get **\`app-debug.apk\`**." >> $GITHUB_STEP_SUMMARY
          echo "4. Tap the APK file to install. If your device displays *'Install Unknown Apps'*, allow it for your browser or file manager." >> $GITHUB_STEP_SUMMARY
          echo "5. Open **Aura** and enjoy testing your build directly on device!" >> $GITHUB_STEP_SUMMARY
